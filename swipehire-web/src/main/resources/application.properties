spring.application.name=swipehire

# ---------- MySQL ----------
# Credentials come from environment variables so passwords never get committed.
# rewriteBatchedStatements lets the driver send a JDBC batch as one multi-row INSERT.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:swipehire}?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Our hand-written schema.sql is the single source of truth; Hibernate only checks entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep the Hibernate session open while the JSP renders, so lazy associations used in views can load.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# schema.sql and data.sql are idempotent, so running them on every boot is safe. Set DB_INIT=never to skip.
spring.sql.init.mode=${DB_INIT:always}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ---------- JSP ----------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.servlet.session.timeout=8h

# Uploads (photo <= 2 MB, resume PDF <= 5 MB are checked in the servlets)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- SwipeHire ----------
swipehire.storage-dir=${SWIPEHIRE_DATA:${user.home}/swipehire-data}
swipehire.engine.enabled=true
swipehire.engine.host=localhost
swipehire.engine.port=1099
swipehire.engine.timeout-ms=2000
swipehire.jobs.enabled=true

# Email: disabled = printed to the console (dev). To send real mail set these via env vars.
swipehire.mail.enabled=${MAIL_ENABLED:false}
swipehire.mail.host=${MAIL_HOST:}
swipehire.mail.port=${MAIL_PORT:587}
swipehire.mail.username=${MAIL_USER:}
swipehire.mail.password=${MAIL_PASSWORD:}
swipehire.mail.from=${MAIL_FROM:no-reply@swipehire.in}

logging.level.com.swipehire=INFO
