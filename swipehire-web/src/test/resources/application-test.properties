# Integration tests use their own database so they never touch demo data.
spring.datasource.url=jdbc:mysql://localhost:3306/swipehire_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata&rewriteBatchedStatements=true
swipehire.engine.enabled=false
swipehire.jobs.enabled=false
swipehire.storage-dir=${java.io.tmpdir}/swipehire-test-data
logging.level.com.swipehire=WARN
